name: Verify application and infrastructure
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --junitxml=test-results.xml
      - run: python scripts/http_smoke.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tests-python-${{ matrix.python }}
          path: test-results.xml
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/bootstrap test
      - run: terraform -chdir=infra/workload init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/workload validate
      - run: terraform -chdir=infra/workload test
  browser:
    needs: python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: pip install .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-screenshots
          path: verification/*.png
  container:
    needs: [python, terraform, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: fargate-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the built container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs platform || true; docker rm -f platform || true' EXIT
          docker run -d --name platform --read-only --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:8000:8000 -e APP_REVISION="$GITHUB_SHA" fargate-platform:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS http://127.0.0.1:8000/api/info | jq -e --arg sha "$GITHUB_SHA" '.revision == $sha'
          curl -fsS -H 'Content-Type: application/json' -d '{"task_count":2}' http://127.0.0.1:8000/api/capacity | jq -e '.total_vcpu == 0.5 and .total_memory_gib == 1'
          test "$(docker inspect -f '{{.Config.User}}' platform)" = '10001:10001'

